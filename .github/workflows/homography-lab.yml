name: Homography lab

on:
  push:
    branches: [Dima_test_lab]
  pull_request:
    paths:
      - 'homography_lab/**'
      - '.github/workflows/homography-lab.yml'

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: homography_lab/requirements-core.txt
      - name: Install CPU geometry dependencies
        run: python -m pip install -r homography_lab/requirements-core.txt
      - name: Test portable lab without neural models
        working-directory: homography_lab
        run: python -m pytest -c pytest.ini -q
      - name: Replay cached geometry
        run: python homography_lab/demo.py --output homography_lab/runs/ci-demo
